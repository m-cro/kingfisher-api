name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run tests and build
        run: ./gradlew clean test bootJar --no-daemon

  deploy:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested commit
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST http://127.0.0.1:5910/deploy/api \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"run_id\":\"${GITHUB_RUN_ID}\",\"sha\":\"${GITHUB_SHA}\"}"

  publish-image:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Build and publish
        env:
          GHCR_SHA_IMAGE: ghcr.io/m-cro/kingfisher-api:${{ github.sha }}
          GHCR_LATEST_IMAGE: ghcr.io/m-cro/kingfisher-api:latest
        run: |
          docker build --tag "$GHCR_SHA_IMAGE" --tag "$GHCR_LATEST_IMAGE" .
          docker push "$GHCR_SHA_IMAGE"
          docker push "$GHCR_LATEST_IMAGE"
